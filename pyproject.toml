[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-fidelity-testbed"
version = "0.1.0a1"
description = "Preregistered testbed for pre-boundary intent-fidelity: measuring model-introduced divergence between an authenticated request and the proposed action, before the ExecutionProof boundary."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Derek Hone", email = "derek@remnantfieldworks.com" }]
keywords = [
    "ai-governance",
    "intent-fidelity",
    "executionproof",
    "coherent-inheritance-framework",
    "preregistration",
    "proofrecord",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://executionproof.io"
Repository = "https://github.com/derekhone/intent-fidelity-testbed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
